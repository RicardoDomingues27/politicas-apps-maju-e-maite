<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Chronicles - Abertura animada</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0b1020;color:#e5e7eb;font-family:system-ui,sans-serif;text-align:center}
  header{padding:16px 16px 8px}
  h1{font-size:1.2rem;margin:0 0 4px}
  p{margin:4px 0;color:#9ca3af;font-size:.9rem}
  #stage{position:relative;max-width:960px;margin:8px auto;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
  video{width:100%;height:100%;display:block;background:#000;transition:opacity .2s}
  #play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;font-size:1.3rem;font-weight:800;border:0;width:100%;cursor:pointer}
  nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px;max-width:960px;margin:0 auto}
  nav button{background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:16px;padding:6px 12px;font-weight:700;cursor:pointer}
  nav button.on{background:#f59e0b;color:#111;border-color:#f59e0b}
  a{color:#fbbf24}
</style>
</head>
<body>
<header>
  <h1>Nova Chronicles · Abertura animada</h1>
  <p>Os clipes tocam um depois do outro, na mesma ordem do jogo. Toque no vídeo para pular para o próximo clipe.</p>
  <p><a href="clipes.html">Ver os clipes separados</a> · <a href="../">Voltar à página do jogo</a></p>
</header>
<div id="stage">
  <video id="v" playsinline></video>
  <button id="play">▶ Assistir a abertura completa</button>
</div>
<nav id="nav"></nav>
<script>
  // Mesma ordem da abertura do jogo: cena 1 (4 clipes), cena 2 (3 clipes) e cenas 3 a 6.
  const clips = [
    'clipes/c1a.mp4','clipes/c1b.mp4','clipes/c1c.mp4','clipes/c1d.mp4',
    'clipes/c2a.mp4','clipes/c2b.mp4','clipes/c2c.mp4',
    'intro_3.mp4','intro_4.mp4','intro_5.mp4','intro_6.mp4'
  ];
  const v = document.getElementById('v'), nav = document.getElementById('nav'), play = document.getElementById('play');
  let i = 0;
  clips.forEach((_, n) => {
    const b = document.createElement('button');
    b.textContent = n + 1;
    b.onclick = () => { i = n; load(true); };
    nav.appendChild(b);
  });
  function load(go) {
    v.style.opacity = 0;
    setTimeout(() => {
      v.src = clips[i];
      [...nav.children].forEach((b, k) => b.classList.toggle('on', k === i));
      if (go) { play.style.display = 'none'; v.play(); }
      v.style.opacity = 1;
    }, 150);
  }
  v.onended = () => { if (i < clips.length - 1) { i++; load(true); } };
  v.onclick = () => { if (i < clips.length - 1) { i++; load(true); } };
  play.onclick = () => { i = 0; load(true); };
  v.src = clips[0];
  nav.children[0].classList.add('on');
</script>
</body>
</html>
