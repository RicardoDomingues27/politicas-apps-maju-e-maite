<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Chronicles - Abertura em vídeo (teste)</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0b1020;color:#e5e7eb;font-family:system-ui,sans-serif;text-align:center}
  header{padding:16px 16px 8px}
  h1{font-size:1.2rem;margin:0 0 4px}
  p{margin:4px 0;color:#9ca3af;font-size:.9rem}
  #stage{position:relative;max-width:960px;margin:8px auto;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
  video{width:100%;height:100%;display:block;background:#000}
  #play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;font-size:1.3rem;font-weight:800;border:0;width:100%;cursor:pointer}
  nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px}
  nav button{background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:18px;padding:8px 14px;font-weight:700;cursor:pointer}
  nav button.on{background:#f59e0b;color:#111;border-color:#f59e0b}
</style>
</head>
<body>
<header>
  <h1>Nova Chronicles · Abertura em vídeo (teste)</h1>
  <p>6 cenas animadas pelo Grok a partir das ilustrações, com as vozes geradas por ele. Toque em assistir; as cenas passam sozinhas.</p>
</header>
<div id="stage">
  <video id="v" playsinline></video>
  <button id="play">▶ Assistir a abertura</button>
</div>
<nav id="nav"></nav>
<script>
  const v = document.getElementById('v'), nav = document.getElementById('nav'), play = document.getElementById('play');
  let i = 0;
  for (let n = 1; n <= 6; n++) {
    const b = document.createElement('button');
    b.textContent = 'Cena ' + n;
    b.onclick = () => { i = n - 1; load(true); };
    nav.appendChild(b);
  }
  function load(go) {
    v.src = 'intro_' + (i + 1) + '.mp4';
    [...nav.children].forEach((b, k) => b.classList.toggle('on', k === i));
    if (go) { play.style.display = 'none'; v.controls = true; v.play(); }
  }
  v.onended = () => { if (i < 5) { i++; load(true); } };
  play.onclick = () => { i = 0; load(true); };
  load(false);
</script>
</body>
</html>
