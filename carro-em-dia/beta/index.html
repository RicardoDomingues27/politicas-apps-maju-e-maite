<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/politicas-apps-maju-e-maite/carro-em-dia/beta/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Carro em Dia: histórico das manutenções do carro a partir da foto da nota.">
  <meta name="theme-color" content="#0F5F6E">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Carro em Dia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    html, body { margin: 0; height: 100%; background: #F4F7F8; }
    #loading {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #0F5F6E; transition: opacity .4s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .title { font-size: 26px; font-weight: 800; }
    #loading .msg { font-size: 14px; color: #4A6670; }
    #loading .spin { width: 34px; height: 34px; border-radius: 50%;
      border: 4px solid #CFE3E6; border-top-color: #0F5F6E; animation: r 0.9s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
  <title>Carro em Dia</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading">
    <div class="spin"></div>
    <div class="title">Carro em Dia</div>
    <div class="msg">Abrindo…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      el.classList.add('done');
      setTimeout(function () { el.remove(); }, 450);
      // Guarda o app no aparelho para abrir offline (só em https).
      if ('serviceWorker' in navigator) {
        setTimeout(function () { navigator.serviceWorker.register('sw.js'); }, 2000);
      }
    });
  </script>
  <script src="tesseract/tesseract.min.js" defer></script>
  <script src="ocr.js" defer></script>
  <script src="atualizar.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
