<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E88FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Colorir e Desenhar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-layout="b">

<main id="home" class="screen">
  <div class="sun" aria-hidden="true"></div>
  <div class="cloud c1" aria-hidden="true"></div><div class="cloud c2" aria-hidden="true"></div>
  <svg class="scenery" viewBox="0 0 800 240" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 120 Q150 40 300 110 T600 90 T800 100 V240 H0Z" fill="#7ed957"/>
    <path d="M0 170 Q200 100 400 160 T800 150 V240 H0Z" fill="#4cc15f"/>
    <path d="M0 215 Q200 180 400 210 T800 205 V240 H0Z" fill="#2fa84f"/>
  </svg>
  <div class="deco" aria-hidden="true"><span>🐥</span><span>🐮</span><span>🐷</span><span>🌻</span><span>🐑</span></div>
  <button class="btn fsb" id="hFull" aria-label="Tela cheia"></button>
  <h1 id="logo" class="logo" aria-label="Colorir e Desenhar"></h1>
  <div class="choices">
    <button class="big" id="goDraw" aria-label="Desenhar"><span class="ico">🖍️</span><span class="lbl">Desenhar</span><img id="drawThumb" class="thumb" alt="" hidden></button>
    <button class="big alt" id="goColor" aria-label="Colorir"><span class="ico">🎨</span><span class="lbl">Colorir</span></button>
  </div>
</main>

<main id="worlds" class="screen" hidden>
  <div class="cloud c1" aria-hidden="true"></div><div class="cloud c2" aria-hidden="true"></div>
  <div id="islands" class="islands"></div>
  <button class="btn back" id="worldsBack" aria-label="Voltar">⬅️</button>
</main>

<main id="gallery" class="screen" hidden>
  <div id="grid" class="grid"></div>
  <button class="btn back" id="galBack" aria-label="Voltar">⬅️</button>
  <div id="galTitle" class="gal-title"></div>
</main>

<main id="editor" class="screen" hidden>
  <div id="area" class="area">
    <div id="stage" class="stage">
      <canvas id="paint"></canvas>
      <canvas id="tmp"></canvas>
      <canvas id="lines"></canvas>
    </div>
  </div>
  <div class="floater" aria-label="Ações principais">
    <button class="btn exit" id="bBack" aria-label="Sair e guardar o desenho"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/></svg></button>
    <button class="btn" data-tool="eraser" aria-label="Borracha">🧽</button>
    <button class="btn" id="bUndo" aria-label="Voltar um passo (desfazer)">↩️</button>
    <button class="btn" id="bSave" aria-label="Salvar imagem">💾</button>
  </div>
  <nav id="bar" class="bar" aria-label="Ferramentas">
    <div id="strip" class="strip">
      <button class="btn fsb" id="bFull" aria-label="Tela cheia"></button>
      <i class="sep"></i>
      <button class="btn" data-tool="pencil" aria-label="Pincel">🖌️</button>
      <button class="btn" data-tool="chalk" aria-label="Giz">🖍️</button>
      <button class="btn" data-tool="marker" aria-label="Marcador">🖊️</button>
      <button class="btn" data-tool="rainbow" aria-label="Arco-íris">🌈</button>
      <button class="btn" data-tool="star" aria-label="Carimbo de estrela">⭐</button>
      <button class="btn" data-tool="heart" aria-label="Carimbo de coração">❤️</button>
      <button class="btn" data-tool="bucket" id="bBucket" aria-label="Balde de tinta">🪣</button>
      <i class="sep"></i>
      <button class="btn size" data-s="0" aria-label="Fino"><i class="dot d0"></i></button>
      <button class="btn size" data-s="1" aria-label="Médio"><i class="dot d1"></i></button>
      <button class="btn size" data-s="2" aria-label="Grosso"><i class="dot d2"></i></button>
      <i class="sep"></i>
      <button class="btn" id="bRedo" aria-label="Refazer">↪️</button>
      <button class="btn" id="bClear" aria-label="Limpar tudo">🗑️</button>
      <button class="btn" id="bZoom" aria-label="Tamanho normal" hidden>🔎</button>
      <button class="btn" id="bSound" aria-label="Som">🔊</button>
      <i class="sep" id="sepColors"></i>
    </div>
    <div id="swatches" class="colors"></div>
  </nav>
  <div id="toast" class="toast" hidden>✅</div>
</main>

<div id="rotate" class="rotate" role="alert" aria-label="Vire o aparelho para a posição horizontal">
  <svg class="rot-dev" viewBox="0 0 120 120" aria-hidden="true">
    <g class="rot-anim">
      <rect x="36" y="14" width="48" height="92" rx="9" fill="#fff" stroke="#1b3a63" stroke-width="5"/>
      <rect x="42" y="24" width="36" height="66" rx="3" fill="#ffd60a"/>
      <circle cx="60" cy="98" r="3.5" fill="#1b3a63"/>
      <circle cx="60" cy="52" r="9" fill="#ff6b6b"/><path d="M48 76 Q60 64 72 76" fill="none" stroke="#1e88ff" stroke-width="5" stroke-linecap="round"/>
    </g>
  </svg>
  <svg class="rot-arrow" viewBox="0 0 120 60" aria-hidden="true"><path d="M15 50 Q60 -10 105 45" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><path d="M88 52 L107 47 L102 28" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="rot-txt">Vire o aparelho<br>para o lado 🔄</div>
</div>

<div id="gate" class="gate" hidden role="dialog" aria-label="Área dos pais">
  <div class="gate-card">
    <button class="btn gate-x" id="gateClose" aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/></svg></button>
    <div id="gate1" class="gate-step">
      <div class="gate-left">
        <div class="gate-lock">🔒</div>
        <div class="gate-h">Área dos pais</div>
        <div class="gate-p">Para continuar, responda:</div>
        <div class="gate-q" id="gateQ"></div>
        <div class="gate-ans" id="gateAns">&nbsp;</div>
      </div>
      <div class="keys" id="gateKeys"></div>
    </div>
    <div id="gate2" class="gate-step" hidden>
      <div class="gate-left">
        <div class="gate-lock">⭐</div>
        <div class="gate-h">Desbloquear tudo</div>
        <ul class="gate-list">
          <li>As 6 ilhas e os 41 desenhos</li>
          <li>Pagamento único, sem assinatura</li>
          <li>Sem anúncios, para sempre</li>
        </ul>
      </div>
      <div class="gate-right">
        <div class="gate-price" id="gatePrice">R$ 29,90</div>
        <button class="buy" id="buyBtn">Pagar com a Google Play</button>
        <button class="restore" id="restoreBtn">Já comprei antes</button>
        <div class="gate-msg" id="gateMsg"></div>
      </div>
    </div>
  </div>
</div>

<button id="verBtn" class="ver" aria-label="Versão do aplicativo. Tocar para procurar atualização"><span id="verTxt"></span></button>

<script src="version.js"></script>
<script src="pages.js"></script>
<script src="pages2.js"></script>
<script src="app.js"></script>
</body>
</html>
