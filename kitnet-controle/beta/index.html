<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="/politicas-apps-maju-e-maite/kitnet-controle/beta/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Kitnet Controle: aluguéis, comprovantes, contas e manutenções dos seus kitnets.">
  <meta name="theme-color" content="#2563EB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kitnet Controle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Kitnet Controle</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,body{margin:0;height:100%;background:#F5F7FB;font-family:-apple-system,Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme: dark){html,body{background:#0D1320}#loading{color:#E8EEFB}}
    #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#111827;transition:opacity .4s}
    #loading.done{opacity:0;pointer-events:none}
    #loading .spin{width:38px;height:38px;border-radius:50%;border:4px solid #bcd0fb;border-top-color:#2563EB;animation:g 1s linear infinite}
    #loading .title{font-size:22px;font-weight:800}
    @keyframes g{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="loading"><div class="spin"></div><div class="title">Kitnet Controle</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      el.classList.add('done');
      setTimeout(function () { el.remove(); }, 450);
      if ('serviceWorker' in navigator) {
        setTimeout(function () { navigator.serviceWorker.register('sw.js'); }, 2000);
      }
    });
  </script>
  <script src="tesseract/tesseract.min.js" defer></script>
  <script src="ocr.js" defer></script>
  <script src="atualizar.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
